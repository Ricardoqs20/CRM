{% extends 'base.html' %}

{% block title %}Estoque de Imóveis & Captações - IMOBICRM{% endblock %}
{% block header_title %}🏢 Estoque de Imóveis & Captações{% endblock %}

{% block content %}
<div class="space-y-6" x-data="{ viewMode: '{{ view_mode|default:'grid' }}' }">
    
    <!-- Barra Superior: Busca, Filtros e Alternância de Visualização -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        
        <form id="filter-form" 
              hx-get="{% url 'property_list' %}" 
              hx-trigger="keyup changed delay:300ms from:input, change from:select" 
              hx-target="#property-results" 
              hx-push-url="true"
              class="space-y-4">
            
            <!-- Linha 1: Busca por Texto + Botões de Ação -->
            <div class="flex flex-col md:flex-row gap-3 items-center justify-between">
                <div class="relative flex-1 w-full">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" name="q" value="{{ q|default:'' }}" 
                           placeholder="Buscar por código (ex: AP0101), condomínio, título ou rua..."
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                </div>

                <!-- Alternador Grid / Lista & Botões -->
                <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                    <input type="hidden" name="view_mode" :value="viewMode">
                    
                    <div class="bg-slate-100 p-1 rounded-xl flex items-center border border-slate-200">
                        <button type="button" @click="viewMode = 'grid'; $nextTick(() => htmx.trigger('#filter-form', 'change'))" 
                                :class="viewMode === 'grid' ? 'bg-white text-emerald-700 shadow-sm font-bold' : 'text-slate-500 hover:text-slate-800'"
                                class="px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition">
                            <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                            <span class="hidden sm:inline">Cards</span>
                        </button>
                        <button type="button" @click="viewMode = 'table'; $nextTick(() => htmx.trigger('#filter-form', 'change'))" 
                                :class="viewMode === 'table' ? 'bg-white text-emerald-700 shadow-sm font-bold' : 'text-slate-500 hover:text-slate-800'"
                                class="px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition">
                            <i data-lucide="list" class="w-3.5 h-3.5"></i>
                            <span class="hidden sm:inline">Tabela</span>
                        </button>
                    </div>

                    <button type="button" @click="quickPropertyModal = true" 
                            class="bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl shadow-sm transition flex items-center gap-1.5">
                        <i data-lucide="zap" class="w-4 h-4"></i>
                        <span>Captação Rápida</span>
                    </button>
                    
                    <a href="{% url 'property_create' %}" 
                       class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl shadow-sm transition flex items-center gap-1.5">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Ficha Completa</span>
                    </a>
                </div>
            </div>

            <!-- Linha 2: Filtros Específicos Imobiliários -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 pt-3 border-t border-slate-100 text-xs">
                
                <!-- Bairro -->
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Bairro</label>
                    <select name="neighborhood" class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none">
                        <option value="">Todos os Bairros</option>
                        {% for b in neighborhoods %}
                        <option value="{{ b }}" {% if current_neighborhood == b %}selected{% endif %}>{{ b }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Tipo de Imóvel -->
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Tipo</label>
                    <select name="property_type" class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none">
                        <option value="">Todos os Tipos</option>
                        <option value="apartment" {% if current_type == 'apartment' %}selected{% endif %}>Apartamento</option>
                        <option value="house" {% if current_type == 'house' %}selected{% endif %}>Casa / Sobrado</option>
                        <option value="penthouse" {% if current_type == 'penthouse' %}selected{% endif %}>Cobertura</option>
                        <option value="land" {% if current_type == 'land' %}selected{% endif %}>Terreno / Lote</option>
                        <option value="commercial" {% if current_type == 'commercial' %}selected{% endif %}>Comercial</option>
                    </select>
                </div>

                <!-- Finalidade -->
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Finalidade</label>
                    <select name="transaction_type" class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none">
                        <option value="">Venda & Locação</option>
                        <option value="sale" {% if current_trans == 'sale' %}selected{% endif %}>Venda</option>
                        <option value="rent" {% if current_trans == 'rent' %}selected{% endif %}>Locação</option>
                    </select>
                </div>

                <!-- Status -->
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Status</label>
                    <select name="status" class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none">
                        <option value="">Todos os Status</option>
                        <option value="available" {% if current_status == 'available' %}selected{% endif %}>Disponíveis</option>
                        <option value="draft" {% if current_status == 'draft' %}selected{% endif %}>Rascunhos / Pendentes</option>
                        <option value="under_negotiation" {% if current_status == 'under_negotiation' %}selected{% endif %}>Em Negociação</option>
                        <option value="sold" {% if current_status == 'sold' %}selected{% endif %}>Vendidos</option>
                        <option value="rented" {% if current_status == 'rented' %}selected{% endif %}>Alugados</option>
                    </select>
                </div>

                <!-- Exclusividade -->
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Contrato</label>
                    <select name="is_exclusive" class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none">
                        <option value="">Todos</option>
                        <option value="true" {% if current_exclusive == 'true' %}selected{% endif %}>Apenas Exclusivos ⭐</option>
                    </select>
                </div>

                <!-- Minhas Captações -->
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Captação</label>
                    <select name="my_captures" class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none">
                        <option value="">Toda a Imobiliária</option>
                        <option value="true" {% if current_my_captures == 'true' %}selected{% endif %}>Minhas Captações 💼</option>
                    </select>
                </div>

            </div>
        </form>
    </div>

    <!-- Resultados Reativos (HTMX Target) -->
    <div id="property-results">
        {% include 'properties/partials/property_items.html' %}
    </div>

</div>
{% endblock %}
