<form method="POST" action="{% url 'visit_feedback_save' visit.id %}" class="space-y-4" x-data="{ willPropose: {% if visit.will_make_proposal %}true{% else %}false{% endif %}, rating: {{ visit.client_rating|default:4 }} }">
    {% csrf_token %}

    <!-- Contexto da Visita -->
    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
        <p class="font-bold text-slate-800">
            Imóvel: <span class="text-purple-700">[{{ visit.visit_property.code }}] {{ visit.visit_property.title }}</span>
        </p>
        <p class="text-slate-600">
            Cliente: <strong class="text-slate-800">{{ visit.lead.client.name }}</strong> | Data: {{ visit.scheduled_date|date:"d/m/Y H:i" }}
        </p>
    </div>

    <!-- Status Final da Visita -->
    <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Status da Realização *</label>
        <select name="status" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500">
            <option value="completed" {% if visit.status == 'completed' %}selected{% endif %}>✅ Visita Realizada com Sucesso</option>
            <option value="no_show" {% if visit.status == 'no_show' %}selected{% endif %}>❌ Cliente Não Compareceu (No-show)</option>
            <option value="canceled" {% if visit.status == 'canceled' %}selected{% endif %}>⚪ Visita Cancelada</option>
        </select>
    </div>

    <!-- Avaliação em Estrelas (1 a 5) -->
    <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Avaliação / Receptividade do Cliente</label>
        <div class="flex items-center gap-2">
            <template x-for="star in [1, 2, 3, 4, 5]">
                <button type="button" @click="rating = star" class="text-2xl transition hover:scale-110 focus:outline-none">
                    <span x-text="star <= rating ? '⭐' : '☆'" :class="star <= rating ? 'opacity-100' : 'opacity-40'"></span>
                </button>
            </template>
            <input type="hidden" name="client_rating" :value="rating">
            <span class="text-xs text-slate-500 font-semibold ml-2" x-text="['Muito Fraco', 'Não Gostou', 'Razoável', 'Gostou Muito', 'Excelente / Alto Interesse'][rating - 1]"></span>
        </div>
    </div>

    <!-- Parecer do Cliente -->
    <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Parecer / O que o cliente achou?</label>
        <textarea name="feedback_notes" rows="2" placeholder="Ex: Adorou a varanda gourmet e a vista, mas achou a cozinha um pouco compacta..."
                  class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500">{{ visit.feedback_notes|default:'' }}</textarea>
    </div>

    <!-- Gatilho de Proposta & Automação Kanban -->
    <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2">
        <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" name="will_make_proposal" x-model="willPropose" value="true"
                   class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
            <span class="text-xs font-bold text-emerald-900">
                🤝 Cliente tem intenção de fazer proposta formal!
            </span>
        </label>
        <p class="text-[11px] text-emerald-700">
            ⚡ Ao marcar esta opção, o lead será <strong>movido automaticamente</strong> para a etapa <em>"🤝 Proposta / Negociação"</em> no Kanban.
        </p>

        <div x-show="willPropose" class="pt-2">
            <label class="block text-[11px] font-bold text-emerald-900 mb-1">Condições ou Valor da Proposta</label>
            <textarea name="proposal_details" rows="2" placeholder="Ex: Oferta de R$ 640.000 à vista ou financiamento com entrada de 30%..."
                      class="w-full px-3 py-2 text-xs border border-emerald-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 bg-white">{{ visit.proposal_details|default:'' }}</textarea>
        </div>
    </div>

    <!-- Motivo de Descarte (se não gostou) -->
    <div x-show="!willPropose && rating <= 2">
        <label class="block text-xs font-bold text-slate-700 mb-1">Motivo Principal de Descarte</label>
        <select name="rejection_reason" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500">
            <option value="">Selecione o motivo se descartado...</option>
            <option value="Preço acima do esperado">Preço acima do esperado</option>
            <option value="Planta / Distribuição não agradou">Planta / Distribuição não agradou</option>
            <option value="Localização / Posição solar desfavorável">Localização / Posição solar desfavorável</option>
            <option value="Falta de vaga ou área de lazer">Falta de vaga ou área de lazer</option>
            <option value="Preferiu outro imóvel">Preferiu outro imóvel</option>
            <option value="Outro">Outro motivo</option>
        </select>
    </div>

    <!-- Botões de Ação -->
    <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" @click="feedbackModalOpen = false" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
        <button type="submit" class="px-4 py-2 text-xs font-bold text-white bg-purple-600 hover:bg-purple-500 rounded-lg shadow">Salvar Feedback</button>
    </div>
</form>
